name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**
      - build/**
      - assets/icons/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Cargo.toml has no valid workspace version: '$version'"
            exit 1
          fi
          section=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | grep -vx Unreleased | head -n 1)
          if [ "$section" != "$version" ]; then
            echo "::error::The newest section of CHANGELOG.md is '$section', but Cargo.toml has $version"
            exit 1
          fi
          for crate in hoplix-core hoplix-app hoplix-cli; do
            locked=$(awk -v name="name = \"$crate\"" '$0 == name { getline; print; exit }' Cargo.lock)
            if [ "$locked" != "version = \"$version\"" ]; then
              echo "::error::Cargo.lock has '$locked' for $crate, expected $version"
              exit 1
            fi
          done
          if grep -nE '^[[:space:]]*#define[[:space:]]+AppVersion' installer/Hoplix.iss; then
            echo "::error::installer/Hoplix.iss must not define its own version; it is passed with /DAppVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing tag
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            exists=true
          fi
          if [ "$exists" = false ] && awk '/^## \[Unreleased\]/ { found = 1; next } /^## \[/ { found = 0 } found && NF' CHANGELOG.md | grep -q .; then
            echo "::error::CHANGELOG.md still has entries under [Unreleased]; move them into the section for $VERSION"
            exit 1
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev dpkg-dev desktop-file-utils

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check versions, language files and third-party licenses
        run: cargo test -p hoplix-core --test version --test languages --test third_party_licenses --locked

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Check program versions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            for exe in hoplix.exe hoplix-cli.exe; do
              product=$(powershell -NoProfile -Command "(Get-Item 'target/release/$exe').VersionInfo.ProductVersion")
              product=${product%$'\r'}
              if [ "$product" != "$VERSION" ]; then
                echo "::error::$exe has the product version '$product', expected $VERSION"
                exit 1
              fi
            done
            cli=target/release/hoplix-cli.exe
          else
            cli=target/release/hoplix-cli
          fi
          if ! "$cli" --version | grep -qF "$VERSION"; then
            echo "::error::hoplix-cli --version does not report $VERSION"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          name="Hoplix-$VERSION-${{ matrix.platform }}"
          if [ "$RUNNER_OS" = Windows ]; then
            name="$name-portable"
            binaries=(target/release/hoplix.exe target/release/hoplix-cli.exe)
          else
            binaries=(target/release/hoplix target/release/hoplix-cli)
          fi
          mkdir -p "dist/$name/lang"
          cp "${binaries[@]}" "dist/$name/"
          cp lang/*.lang "dist/$name/lang/"
          cp LICENSE THIRD-PARTY-LICENSES.txt README.md CHANGELOG.md "dist/$name/"
          required=(LICENSE THIRD-PARTY-LICENSES.txt README.md CHANGELOG.md)
          if [ "$RUNNER_OS" = Windows ]; then
            cp installer/hoplix.portable "dist/$name/"
            required+=(hoplix.portable)
          fi
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            7z a -tzip -bso0 "$archive" "$name"
            contents=$(7z l -ba -slt "$archive" | sed -n 's/^Path = //p' | tr '\134' /)
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
            contents=$(tar -tzf "$archive")
          fi
          for file in "${required[@]}"; do
            if ! grep -qxF "$name/$file" <<< "$contents"; then
              echo "::error::$archive does not contain $file"
              exit 1
            fi
          done
          sha256sum "$archive" > "$archive.sha256"
          rm -r "$name"

      - name: Package Linux packages
        if: runner.os == 'Linux'
        run: |
          package_version="${VERSION//-/\~}"
          stage="$RUNNER_TEMP/package/root"
          mkdir -p "$stage/usr/bin" "$stage/usr/share/hoplix/lang" "$stage/usr/share/applications" "$stage/usr/share/doc/hoplix"
          install -m 755 target/release/hoplix target/release/hoplix-cli "$stage/usr/bin/"
          install -m 644 lang/*.lang "$stage/usr/share/hoplix/lang/"
          install -m 644 installer/linux/hoplix.desktop "$stage/usr/share/applications/hoplix.desktop"
          for size in 16 32 64 128 256; do
            install -D -m 644 "assets/icons/icon-$size.png" "$stage/usr/share/icons/hicolor/${size}x${size}/apps/hoplix.png"
          done
          install -D -m 644 assets/icons/icon.svg "$stage/usr/share/icons/hicolor/scalable/apps/hoplix.svg"
          install -m 644 LICENSE THIRD-PARTY-LICENSES.txt README.md CHANGELOG.md installer/linux/copyright "$stage/usr/share/doc/hoplix/"
          desktop-file-validate "$stage/usr/share/applications/hoplix.desktop"

          shlibs="$RUNNER_TEMP/package/shlibs"
          mkdir -p "$shlibs/debian"
          printf 'Source: hoplix\n\nPackage: hoplix\nArchitecture: any\n' > "$shlibs/debian/control"
          linked=$(cd "$shlibs" && dpkg-shlibdeps -O "$stage/usr/bin/hoplix" "$stage/usr/bin/hoplix-cli" 2> /dev/null | sed -n 's/^shlibs:Depends=//p')
          if [ -z "$linked" ]; then
            echo "::error::dpkg-shlibdeps found no linked libraries"
            exit 1
          fi

          deb="dist/hoplix_${package_version}_amd64.deb"
          deb_root="$RUNNER_TEMP/package/deb"
          mkdir -p "$deb_root/DEBIAN"
          cp -R "$stage/." "$deb_root/"
          size=$(du -sk "$deb_root" | cut -f 1)
          sed -e "s/APP_VERSION/$package_version/" -e "s/INSTALLED_SIZE/$size/" -e "s/LINKED_LIBRARIES/$linked/" installer/linux/control > "$deb_root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$deb_root" "$deb"

          sudo apt-get install -y --no-install-recommends rpm > /dev/null
          rpm_top="$RUNNER_TEMP/package/rpmbuild"
          sed "s/APP_VERSION/$package_version/" installer/linux/hoplix.spec > "$RUNNER_TEMP/package/hoplix.spec"
          rpmbuild -bb --quiet --define "_topdir $rpm_top" --define "_sourcedir $RUNNER_TEMP/package" "$RUNNER_TEMP/package/hoplix.spec"
          cp "$rpm_top"/RPMS/x86_64/*.rpm dist/

          cd dist
          for package in *.deb *.rpm; do
            sha256sum "$package" > "$package.sha256"
          done

      - name: Check Linux packages
        if: runner.os == 'Linux'
        run: |
          package_version="${VERSION//-/\~}"
          deb="dist/hoplix_${package_version}_amd64.deb"
          rpm="dist/hoplix-${package_version}-1.x86_64.rpm"
          dpkg-deb --info "$deb"
          if [ "$(dpkg-deb --field "$deb" Version)" != "$package_version" ]; then
            echo "::error::$deb does not have the version $package_version"
            exit 1
          fi
          rpm -qpi "$rpm"
          if [ "$(rpm -qp --queryformat '%{VERSION}' "$rpm")" != "$package_version" ]; then
            echo "::error::$rpm does not have the version $package_version"
            exit 1
          fi
          rpm -qpR "$rpm" | grep -q 'libxkbcommon.so.0'
          rpm -qpR "$rpm" | grep -q 'libc.so.6'
          rpm -qlp "$rpm" | grep -q '^/usr/share/icons/hicolor/256x256/apps/hoplix.png$'
          rpm -qlp "$rpm" | grep -q '^/usr/share/hoplix/lang/de.lang$'
          sudo apt-get install -y "./$deb"
          test -x /usr/bin/hoplix
          test -f /usr/share/applications/hoplix.desktop
          test -f /usr/share/hoplix/lang/en.lang
          desktop-file-validate /usr/share/applications/hoplix.desktop
          for binary in /usr/bin/hoplix /usr/bin/hoplix-cli; do
            if ldd "$binary" | grep 'not found'; then
              echo "::error::$binary has missing libraries"
              exit 1
            fi
          done
          if ! /usr/bin/hoplix-cli --version | grep -qF "$VERSION"; then
            echo "::error::The installed hoplix-cli does not report $VERSION"
            exit 1
          fi
          sudo apt-get purge -y hoplix

      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = @(
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            $compiler = @(
              (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe")
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          & $compiler /Qp "/DAppVersion=$env:VERSION" installer\Hoplix.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location dist
          $setup = "Hoplix-$env:VERSION-windows-x64-setup.exe"
          $product = (Get-Item $setup).VersionInfo.ProductVersion.Trim()
          if ($product -ne $env:VERSION) {
            Write-Output "::error::$setup has the product version '$product', expected $env:VERSION"
            exit 1
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$setup" | Out-File -Encoding ascii -NoNewline "$setup.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name != 'pull_request' && needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no text for version $VERSION"
            exit 1
          fi

          cd dist
          for file in *; do
            case "$file" in *.sha256) continue ;; esac
            if [ ! -s "$file.sha256" ]; then
              echo "::error::$file has no .sha256 file"
              exit 1
            fi
          done

          prerelease=()
          case "$VERSION" in 0.*|*-*) prerelease=(--prerelease) ;; esac

          gh release create "$TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hoplix $VERSION" \
            --notes-file "$notes" \
            "${prerelease[@]}"

          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::The repository secret VT_API_KEY is not set, so $TAG has no VirusTotal scan"
            exit 0
          fi

          {
            cat "$notes"
            echo
            echo "---"
            echo
            echo "### VirusTotal Scan Report"
            echo "Scanned on: $(date -u +%Y-%m-%d)"
            echo
            for file in *; do
              case "$file" in *.sha256) continue ;; esac
              upload=https://www.virustotal.com/api/v3/files
              if [ "$(stat -c %s "$file")" -gt 33554432 ]; then
                upload=$(curl --fail --silent --show-error \
                  --header "x-apikey: $VT_API_KEY" \
                  https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
              fi
              curl --fail --silent --show-error \
                --header "x-apikey: $VT_API_KEY" \
                --form "file=@$file" \
                "$upload" > /dev/null
              hash=$(cut -d ' ' -f 1 "$file.sha256")
              echo "- **$file:** [Scan Report](https://www.virustotal.com/gui/file/$hash)"
            done
          } > "$notes.scanned"

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes.scanned"

  discord:
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
    uses: TripleT3005/TripleT3005/.github/workflows/discord-release.yml@main
    with:
      title: Hoplix ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      tag: v${{ needs.version.outputs.version }}
      page: hoplix
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
