# Listener

Port 2224
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile none

# Authentication

PermitRootLogin no
AllowUsers demo
UsePAM yes
PubkeyAuthentication no
PasswordAuthentication no
KbdInteractiveAuthentication yes
AuthenticationMethods keyboard-interactive

# Subsystems

Subsystem sftp internal-sftp
