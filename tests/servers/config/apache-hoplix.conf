# Server

ServerName localhost
DavLockDB /var/lib/dav/lockdb
ErrorLog /proc/self/fd/2
LogLevel warn

# HTTP

<VirtualHost *:2280>
    Include /opt/hoplix/config/apache-dav.inc
</VirtualHost>

# HTTPS

<VirtualHost *:2443>
    SSLEngine on
    SSLCertificateFile /etc/hoplix/tls/cert.pem
    SSLCertificateKeyFile /etc/hoplix/tls/key.pem
    Include /opt/hoplix/config/apache-dav.inc
</VirtualHost>
