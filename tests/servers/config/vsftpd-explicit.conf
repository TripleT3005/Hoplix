# Listener

listen=YES
listen_ipv6=NO
listen_port=2221
background=NO
seccomp_sandbox=NO
isolate=NO
isolate_network=NO
secure_chroot_dir=/var/run/vsftpd/empty

# Users

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
pam_service_name=vsftpd
utf8_filesystem=YES

# Passive mode

pasv_enable=YES
pasv_address=127.0.0.1
pasv_addr_resolve=NO
pasv_min_port=40000
pasv_max_port=40009

# TLS

ssl_enable=YES
force_local_logins_ssl=NO
force_local_data_ssl=NO
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/hoplix/tls/cert.pem
rsa_private_key_file=/etc/hoplix/tls/key.pem
