[workspace]
members = ["crates/hoplix-core", "crates/hoplix-app", "crates/hoplix-cli"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
hoplix-core = { path = "crates/hoplix-core" }
tokio = { version = "1.54.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev.package.ring]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
